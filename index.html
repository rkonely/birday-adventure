<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BirDay Adventure — Птичье Приключение</title>
  <meta name="description" content="Персональная браузерная игра-приключение ко дню рождения.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Главный игровой контейнер: 16:9 соотношение -->
  <div id="game-container">

    <!-- Фоновое зацикленное видео -->
    <div id="video-wrapper">
      <video id="bg-video" src="assets/videos/MainMenu%20-%20Waiting.mp4" autoplay loop muted playsinline
        preload="auto"></video>
      <div class="crt-overlay"></div>
    </div>

    <!-- Игровой Canvas для геймплейных этапов (платформер, настолка, босс) -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Слой -->
    <div id="ui-layer">

      <!-- Верхняя панель (Звук, Полноэкранный режим) -->
      <header id="top-bar">
          <button id="btn-boss-arena" class="icon-btn boss-arena-btn" title="Этап 3: Битва с Бобром (F6)" aria-label="Босс">
            <span class="icon">🦫</span>
            <span class="dev-flight-text">БОСС</span>
          </button>
          <button id="btn-stage2-board" class="icon-btn stage2-board-btn" title="Этап 2: Настольная игра (F4)" aria-label="Настолка">
            <span class="icon">🎲</span>
            <span class="dev-flight-text">НАСТОЛКА</span>
          </button>
          <button id="btn-stage2-editor" class="icon-btn stage2-editor-btn" title="Конструктор клеток настольной игры (F5)" aria-label="Редактор 2">
            <span class="icon">🗺️</span>
            <span class="dev-flight-text">РЕДАКТОР 2</span>
          </button>
          <button id="btn-stage1-editor" class="icon-btn stage1-editor-btn" title="Конструктор уровня 1: расстановка объектов (F3)" aria-label="Конструктор 1">
            <span class="icon">🛠️</span>
            <span class="dev-flight-text">РЕДАКТОР 1</span>
          </button>
          <button id="btn-stage1-forest" class="icon-btn stage1-level-btn" title="Этап 1: Лесной Полёт (Основной уровень) (F1)" aria-label="Уровень 1">
            <span class="icon">🌲</span>
            <span class="dev-flight-text">УРОВЕНЬ 1</span>
          </button>
          <button id="btn-dev-flight" class="icon-btn dev-flight-btn" title="Тест Полёта Кукушки (Калибровка) (F2)" aria-label="Тест Полёта">
            <span class="icon">🪶</span>
            <span class="dev-flight-text">ПОЛЁТ</span>
          </button>
          <button id="btn-sound" class="icon-btn" title="Вкл/Выкл звук" aria-label="Звук">
            <span class="icon">🔊</span>
          </button>
          <button id="btn-fullscreen" class="icon-btn" title="Во весь экран" aria-label="Во весь экран">
            <span class="icon">⛶</span>
          </button>
        </div>
      </header>

      <!-- Экран 1: Главное меню (Зацикленное видео ожидания) -->
      <section id="screen-title" class="screen active">
        <!-- Кнопка Старта в точной позиции как на скриншоте -->
        <button id="btn-start" class="btn-start-adventure" aria-label="Начать приключение">
          <div class="btn-text-wrapper">
            <span class="btn-line">НАЧАТЬ</span>
            <div class="btn-line-with-arrow">
              <span class="btn-line">ПРИКЛЮЧЕНИЕ</span>
              <span class="btn-arrow">▶</span>
            </div>
          </div>
        </button>
      </section>

      <!-- Экран 2: Форма регистрации (размещена справа, на фоне видео MainMenu - Typing.mp4) -->
      <section id="screen-form" class="screen hidden">
        <div id="registration-window" class="registration-window">

          <!-- Верхняя каменная плашка "Регистрация" -->
          <div class="registration-title-stone">
            <span class="registration-title-text">Регистрация</span>
          </div>

          <form id="auth-form" class="registration-form" onsubmit="return false;">

            <!-- Поле: Имя Игрока -->
            <div class="reg-form-group">
              <label for="player-name" class="reg-label">Имя Игрока</label>
              <div class="reg-field-box">
                <input type="text" id="player-name" maxlength="18" placeholder="Пилот" value="" autocomplete="off"
                  required>
              </div>
            </div>

            <!-- Поле: Дата Рождения -->
            <div class="reg-form-group">
              <label class="reg-label">Дата Рождения</label>
              <div class="reg-date-row">

                <!-- Выбор дня -->
                <div class="reg-date-box" id="box-select-day">
                  <span id="display-day" class="date-display-num">00</span>
                  <div class="date-arrow-icon"></div>
                  <select id="select-day" class="date-native-select" aria-label="День"></select>
                </div>

                <!-- Выбор месяца -->
                <div class="reg-date-box" id="box-select-month">
                  <span id="display-month" class="date-display-num">00</span>
                  <div class="date-arrow-icon"></div>
                  <select id="select-month" class="date-native-select" aria-label="Месяц">
                    <option value="0" selected>00</option>
                    <option value="1">01</option>
                    <option value="2">02</option>
                    <option value="3">03</option>
                    <option value="4">04</option>
                    <option value="5">05</option>
                    <option value="6">06</option>
                    <option value="7">07</option>
                    <option value="8">08</option>
                    <option value="9">09</option>
                    <option value="10">10</option>
                    <option value="11">11</option>
                    <option value="12">12</option>
                  </select>
                </div>

              </div>
            </div>

            <!-- Строка HARDCORE и Чекбокс -->
            <div class="reg-hardcore-row">
              <span class="hardcore-label">HARDCORE</span>
              <label class="hardcore-checkbox-wrapper" for="check-hardcore">
                <input type="checkbox" id="check-hardcore" class="sr-only">
                <div class="custom-checkbox-frame">
                  <div class="checkbox-indicator"></div>
                </div>
              </label>
            </div>

            <!-- Кнопка ГОТОВО (Green Button.png) -->
            <button type="submit" id="btn-submit-data" class="btn-green-submit" aria-label="Готово">
              <span class="btn-green-text">ГОТОВО</span>
            </button>

          </form>
        </div>

        <!-- Облачко реплики пилота (Menu - Dialog.png) рядом с клювом птицы -->
        <div id="pilot-dialog-bubble" class="pilot-dialog-bubble hidden" aria-live="polite">
          <p id="pilot-dialog-text" class="pilot-dialog-text">Эй, у самолета рейс только для именинника!</p>
        </div>

      </section>

      <!-- Экран 3: Переход к Этапу I -->
      <section id="screen-transition" class="screen hidden">
        <div class="transition-container pixel-frame">
          <div class="loading-spinner"></div>
          <h2 id="transition-title" class="transition-heading">ПРОВЕРКА ПРОЙДЕНА!</h2>
          <p id="transition-desc" class="transition-desc">Инструктор вбивает координаты в бортовой калькулятор...</p>
          <div class="progress-bar-container">
            <div id="transition-progress" class="progress-bar-fill"></div>
          </div>
        </div>
      </section>

      <!-- Кнопка пропуска видео (активна во время видео-катсцен) -->
      <button id="btn-skip-video" class="btn-skip-cutscene hidden" aria-label="Пропустить видео">
        <span class="skip-btn-text">ПРОПУСТИТЬ</span>
        <span class="skip-btn-arrows">▶▶</span>
      </button>

      <!-- Экран 4: Завершение Уровня 1 / Старт Уровня 2 (LEVEL 2 START) -->
      <section id="screen-level2-start" class="screen hidden">
        <div class="level2-backdrop" id="level2-backdrop"></div>
        <div class="level2-board-card" id="level2-board-card">
          <!-- Картинка доски / свитка LEVEL 2 START.png -->
          <img src="assets/UI/LEVEL 2 START.png" alt="Первый Рубеж ПРОЙДЕН!" class="level2-board-img" id="level2-board-img" />

          <!-- Контентная зона со статистикой на пергаменте -->
          <div class="level2-board-content">
            
            <div class="level2-pilot-badge">
              <span class="l2-pilot-label">ПИЛОТ:</span>
              <span class="l2-pilot-val" id="l2-pilot-name">ИМЕНИННИК</span>
            </div>

            <!-- Сетка статистики первого уровня -->
            <div class="level2-stats-grid">
              
              <!-- 1. Сколько яиц отложил -->
              <div class="level2-stat-box">
                <div class="stat-box-icon">
                  <img src="assets/First-Level/Item/Egg/Default-Egg.png" alt="Яйцо" class="stat-egg-icon" />
                </div>
                <div class="stat-box-text">
                  <span class="stat-box-title">ОТЛОЖЕНО ЯИЦ</span>
                  <span class="stat-box-number" id="l2-stat-eggs">0</span>
                </div>
              </div>

              <!-- 2. Сколько кормушек съел -->
              <div class="level2-stat-box">
                <div class="stat-box-icon">
                  <img src="assets/First-Level/Feeder/feeder-house.png" alt="Кормушка" class="stat-feeder-icon" />
                </div>
                <div class="stat-box-text">
                  <span class="stat-box-title">КОРМУШЕК СЪЕДЕНО</span>
                  <span class="stat-box-number" id="l2-stat-feeders">0 / 4</span>
                </div>
              </div>

              <!-- 3. Сколько раз упал вниз -->
              <div class="level2-stat-box">
                <div class="stat-box-icon">
                  <span class="stat-emoji">💥</span>
                </div>
                <div class="stat-box-text">
                  <span class="stat-box-title">ПАДЕНИЙ ВНИЗ</span>
                  <span class="stat-box-number" id="l2-stat-falls">0</span>
                </div>
              </div>

              <!-- 4. Время прохождения уровня -->
              <div class="level2-stat-box">
                <div class="stat-box-icon">
                  <span class="stat-emoji">⏱️</span>
                </div>
                <div class="stat-box-text">
                  <span class="stat-box-title">ВРЕМЯ УРОВНЯ</span>
                  <span class="stat-box-number" id="l2-stat-time">00:00</span>
                </div>
              </div>

            </div>

            <!-- Дополнительная сводка: Очки и Гнезда -->
            <div class="level2-sub-row">
              <div class="level2-pill">
                <span class="pill-label">ОЧКИ:</span>
                <span class="pill-value" id="l2-stat-score">0</span>
              </div>
              <div class="level2-pill">
                <span class="pill-label">ГНЁЗДА:</span>
                <span class="pill-value" id="l2-stat-nests">0 / 5</span>
              </div>
            </div>

            <!-- Кнопки действий -->
            <div class="level2-actions-row">
              <button id="btn-level2-start-next" class="btn-l2-wood btn-l2-green" title="Начать Уровень 2">
                <span>УРОВЕНЬ 2 ▶</span>
              </button>
              <button id="btn-level2-replay" class="btn-l2-wood" title="Пройти Уровень 1 заново">
                <span>ПОВТОРИТЬ 🔄</span>
              </button>
              <button id="btn-level2-menu" class="btn-l2-wood btn-l2-stone" title="В Главное меню">
                <span>В МЕНЮ 🏠</span>
              </button>
            </div>

          </div>
        </div>

        <!-- Кнопка Старта 2 уровня в центре снизу (расположение как на начальном экране) -->
        <button id="btn-level2-continue" class="btn-start-adventure hidden" aria-label="Продолжить приключение">
          <div class="btn-text-wrapper">
            <span class="btn-line">ПРОДОЛЖИТЬ</span>
            <div class="btn-line-with-arrow">
              <span class="btn-line">ПРИКЛЮЧЕНИЕ!</span>
              <span class="btn-arrow">▶</span>
            </div>
          </div>
        </button>
      </section>

      <!-- Уведомления -->
      <div id="toast-container"></div>
    </div>
  </div>

  <!-- Главный скрипт модулей ES6 -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
